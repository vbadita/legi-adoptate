# /etc/nginx/conf.d/legi-adoptate-maps.conf  (http {} level)
# ?zi=YYYY-MM-DD from the date form -> the day's static page. Anything that is
# not a well-formed date maps to "" and never reaches a file path.
map $arg_zi $legi_zi {
    "~^(?<d>20[0-9]{2}-[0-1][0-9]-[0-3][0-9])$" $d;
    default "";
}
