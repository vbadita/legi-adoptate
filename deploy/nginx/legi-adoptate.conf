# /etc/nginx/apps.badita.com.d/legi-adoptate.conf  (inside the apps.badita.com server {})
# Static site: /srv/legi/legi-adoptate is a symlink to the live release (legi-site-sync). No code runs per visitor.

location = /legi-adoptate { return 301 /legi-adoptate/; }

location = /legi-adoptate/ {
    if ($legi_zi != "") { return 302 /legi-adoptate/zi/$legi_zi.html; }   # date form
    root /srv/legi;
    try_files /legi-adoptate/index.html =404;
    include /etc/nginx/apps.badita.com.d/legi-adoptate-headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
}

location /legi-adoptate/ {
    root /srv/legi;
    try_files $uri =404;                    # only files that exist; no directory listing
    error_page 404 /legi-adoptate/404.html;
    include /etc/nginx/apps.badita.com.d/legi-adoptate-headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;   # pages change daily: revalidate (ETag)
    location = /legi-adoptate/style.css {
        root /srv/legi;
        include /etc/nginx/apps.badita.com.d/legi-adoptate-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
